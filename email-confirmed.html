<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>365 FITNESS - Email confirmed</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f5f8f7;
        color: #17211f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 520px;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        color: #063c38;
      }

      .check {
        color: #008f7a;
        font-size: 48px;
        line-height: 1;
        margin-bottom: 16px;
      }

      p {
        font-size: 18px;
        line-height: 1.5;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>365 FITNESS</h1>
      <div class="check" aria-hidden="true">&#10003;</div>
      <p><strong>Email confirmed</strong></p>
      <p>Your 365 FITNESS account has been verified.</p>
      <p>You may return to the app and sign in.</p>
    </main>
  </body>
</html>
